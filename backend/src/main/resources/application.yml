spring:
  application:
    name: fannet-backend
  data:
    mongodb:
      uri: mongodb://${MONGO_USER:fannet}:${MONGO_PASSWORD:change-me}@localhost:${MONGO_PORT:27017}/fannet?authSource=admin&directConnection=true

logging:
  pattern:
    # %X{traceId} comes from TraceIdFilter; use `prod` profile for JSON logs
    correlation: "[%X{traceId:-}] "

mongock:
  migration-scan-package:
    - com.fannet.shared.migration
  transactional: false # index creation is not allowed inside transactions

management:
  endpoints:
    web:
      exposure:
        include: health

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: logstash
